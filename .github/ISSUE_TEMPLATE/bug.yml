name: Bug Report
description: Report a bug in the Forge platform
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Portal (frontend)
        - Portal (backend)
        - Spark / Compute
        - Trino
        - Airflow / Orchestration
        - Infrastructure (Bicep/Helm)
        - SDK / CLI
        - Documentation
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant logs or error messages.
      render: shell
