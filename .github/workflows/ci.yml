name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (ruff)
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend — lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run type-check

      - name: Build
        run: npm run build

  helm:
    name: Helm — lint charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint compute charts
        run: |
          for chart in infra/helm/compute/*/; do
            [ -f "$chart/Chart.yaml" ] && helm lint "$chart" || true
          done

      - name: Lint orchestration charts
        run: |
          for chart in infra/helm/orchestration/*/; do
            [ -f "$chart/Chart.yaml" ] && helm lint "$chart" || true
          done

  bicep:
    name: Bicep — validate templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep syntax
        continue-on-error: true
        run: |
          az bicep build --file infra/bicep/environments/dev/main.bicep --stdout > /dev/null
