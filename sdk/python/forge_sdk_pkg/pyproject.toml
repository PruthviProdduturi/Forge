[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================================
# forge-sdk — Forge Platform SDK for data engineers
#
# This is a standalone installable for the forge_sdk package that lives at
# ../forge_sdk/ (one directory up from here).  The package source is shared
# with the forge-dq source tree — both sit under sdk/python/ and are
# discovered by their respective pyproject.toml files.
#
# Install:
#   pip install -e sdk/python/forge_sdk_pkg/
#   # or in the Spark Docker image:
#   pip install forge-sdk==0.1.0
# =============================================================================

[project]
name = "forge-sdk"
version = "0.1.0"
description = "Forge Platform SDK — SparkSession factory, ADLS path helpers, base job class, platform config"
readme = "../forge_sdk/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["forge", "spark", "delta", "adls", "azure", "data-engineering"]
dependencies = [
    "pyspark>=4.1.0",
    "delta-spark>=4.0.0",
    "azure-identity>=1.17.1",
    "azure-storage-file-datalake>=12.18.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pyarrow>=16.0",
]

[tool.setuptools.packages.find]
# Resolve the forge_sdk package from the parent sdk/python/ directory.
where = [".."]
include = ["forge_sdk*"]
