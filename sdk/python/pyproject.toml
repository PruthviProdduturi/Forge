[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# forge-dq — Data Quality framework
# =============================================================================

[project]
name = "forge-dq"
version = "0.1.0"
description = "Forge Data Quality framework — automatic profiling, rule-based gates, anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.1.0",
    "delta-spark>=4.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "openlineage-python>=1.18.0",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=2.9",
    "apache-airflow-providers-cncf-kubernetes>=8.4",
]

# forge-sdk lives in forge_sdk/ alongside forge_dq/ in the same source tree.
# Both packages are discovered by the packages.find rule below.
# To install forge-sdk use the separate forge_sdk_pkg/pyproject.toml:
#   pip install -e sdk/python/forge_sdk_pkg/
sdk = [
    "azure-identity>=1.17.1",
    "azure-storage-file-datalake>=12.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
# Discover both forge_dq and forge_sdk sub-packages from this source tree.
# forge-sdk has its own installable at forge_sdk_pkg/pyproject.toml which
# uses the same source path via a symlink / path reference.
include = ["forge_dq*", "forge_sdk*"]
