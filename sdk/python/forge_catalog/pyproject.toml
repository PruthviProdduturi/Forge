[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "forge-catalog"
version         = "1.0.0"
description     = "Forge Asset Catalog — discover tables, schemas, and datasets across the Forge lakehouse"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"

# Deliberately lightweight — no PySpark dependency so this can be installed
# in notebooks, scripts, and future SDKs (forge-contracts, forge-sources)
# without pulling in the full Spark runtime.
dependencies = [
    "trino>=0.328.0",
    "httpx>=0.27.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://dev.azure.com/L1R/Data%20Science%20Engineering/_git/DSEng%20Core%20Infra"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_catalog*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
