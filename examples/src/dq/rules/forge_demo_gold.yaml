# DQ rules for forge_demo_gold — edit this file to add domain rules
# Generated by: forge generate --job forge_demo_gold
# Applied by:   forge_dq @track decorator inside forge_demo_gold.py
#
# Severity levels:
#   critical — job fails on violation (fail_fast=true)
#   warning  — logged and continued; never fails the job
#
# Rule types supported by forge_dq:
#   not_null, row_count, unique, accepted_values,
#   min_value, max_value, regex, custom_sql, max_staleness_hours

version: "v1"
dataset: "lakehouse.gold.retail_{GOLD_TABLE}"
description: "Quality rules for forge_demo_gold"
owner: data-engineering
tags: ["gold", "forge_demo_gold", "forge-demo", "retail", "daily", "analytics"]

rules:

  # ---------------------------------------------------------------------------
  # Completeness — partition columns
  # ---------------------------------------------------------------------------

  - name: not_null___date
    type: not_null
    column: __date
    severity: critical
    description: Partition column must never be null.

  # ---------------------------------------------------------------------------
  # Uniqueness
  # ---------------------------------------------------------------------------
  - name: row_count_positive
    type: row_count
    min: 1
    severity: critical
    description: Table must contain at least one row per partition.

