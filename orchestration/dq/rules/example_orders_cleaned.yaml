# =============================================================================
# Forge DQ Rules — silver/orders_cleaned
#
# This file defines data quality rules for the orders silver layer.
# It serves as a well-commented reference for authoring your own rule files.
#
# Schema:
#   version      - Rules schema version (always "1")
#   dataset      - Dataset path relative to the medallion layer
#   description  - Human-readable description
#   owner        - Team or individual responsible for these rules
#   primary_key  - Column(s) that form the logical primary key
#   rules        - List of rule definitions (see rule types below)
#   anomaly_detection - SPC anomaly detection settings
#
# Rule types:
#   not_null        - Ensures specified columns contain no NULL values
#   value_range     - Ensures numeric values fall within [min, max]
#   accepted_values - Ensures values belong to an allowed set
#   unique_key      - Ensures no duplicate combinations of key columns
#   row_count_delta - Ensures row count has not dropped by more than X%
#   custom_sql      - Runs arbitrary SQL; asserts result equals expected
#
# Severity levels:
#   critical - Failure blocks the pipeline (when FORGE_DQ_FAIL_ON_CRITICAL=true)
#   warning  - Failure is recorded but never blocks the pipeline
#   info     - Informational check; never blocks the pipeline
# =============================================================================

version: "1"
dataset: silver/orders_cleaned
description: "Quality rules for the orders silver layer"
owner: "data-engineering"
primary_key: [order_id]

rules:
  # ---------------------------------------------------------------------------
  # Completeness: core columns must not be NULL
  # ---------------------------------------------------------------------------
  - name: order_id_not_null
    type: not_null
    columns: [order_id, customer_id, amount]
    severity: critical
    # Checks all three columns in a single aggregation pass.
    # Failed rows = total null count across all listed columns.

  # ---------------------------------------------------------------------------
  # Validity: amount must be non-negative
  # ---------------------------------------------------------------------------
  - name: amount_non_negative
    type: value_range
    column: amount
    min: 0
    # max is optional — omit it to only enforce a lower bound
    severity: critical

  # ---------------------------------------------------------------------------
  # Validity: status must be one of the known values
  # ---------------------------------------------------------------------------
  - name: status_accepted_values
    type: accepted_values
    column: status
    values: [open, closed, pending, cancelled, refunded]
    severity: critical

  # ---------------------------------------------------------------------------
  # Uniqueness: order_id must be unique across all rows
  # ---------------------------------------------------------------------------
  - name: no_duplicate_orders
    type: unique_key
    columns: [order_id]
    severity: critical
    # To check a composite key, list multiple columns:
    #   columns: [order_id, order_line_id]

  # ---------------------------------------------------------------------------
  # Volume check: row count should not drop by more than 20% vs recent average
  # ---------------------------------------------------------------------------
  - name: row_count_not_collapsed
    type: row_count_delta
    max_drop_pct: 20       # Maximum allowed percentage drop
    lookback_runs: 7       # Compare against last 7 successful runs
    severity: critical
    # On the first run (no prior history) this rule always passes.

  # ---------------------------------------------------------------------------
  # Timeliness: no orders should have a future order_date
  # This is a warning (not critical) because clock-skew is possible.
  # ---------------------------------------------------------------------------
  - name: order_date_not_future
    type: custom_sql
    sql: "SELECT COUNT(*) FROM {table} WHERE order_date > current_date()"
    expected: 0
    severity: warning
    # The {table} placeholder is replaced with a temporary view at runtime.
    # The SQL must return a single scalar integer.

# =============================================================================
# Anomaly Detection
#
# Uses Statistical Process Control (Z-score) to flag unusual metric values.
# Requires at least 7 historical runs to produce results.
#
# Monitored metrics:
#   - rows_written          — total row count per run
#   - null_rate per column  — null fraction per column per run
# =============================================================================

anomaly_detection:
  enabled: true
  lookback_days: 30         # Days of history used to compute mean/stddev
  z_score_threshold: 3.0   # |Z| > threshold → flagged as anomaly
  # A z_score_threshold of 3.0 corresponds to ~0.27% false-positive rate
  # under a normal distribution (three-sigma rule).
