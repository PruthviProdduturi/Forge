# =============================================================================
# Stratum — Grafana Dashboard Provider Configuration
#
# This file tells Grafana where to find dashboard JSON files and how to
# manage them. Grafana reads all .json files in the specified path and
# creates them as provisioned dashboards.
#
# Provisioned dashboards are read-only in the UI — they cannot be saved
# over the baked-in version. This prevents configuration drift between
# environments. Engineers who want to edit dashboards must modify the JSON
# in the repo and rebuild the image.
# =============================================================================

apiVersion: 1

providers:

  # ---------------------------------------------------------------------------
  # Spark Dashboards
  # ---------------------------------------------------------------------------
  - name: Spark
    orgId: 1
    folder: Spark
    folderUid: stratum-spark
    type: file
    disableDeletion: true
    updateIntervalSeconds: 0
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/spark
      foldersFromFilesStructure: false

  # ---------------------------------------------------------------------------
  # Airflow / Orchestration Dashboards
  # ---------------------------------------------------------------------------
  - name: Airflow
