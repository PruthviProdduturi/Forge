# =============================================================================
# Forge — Spark Default Configuration
# Baked into the forgeacr/spark image at build time.
#
# These are baseline defaults. Values can be overridden at job submission time
# via SparkApplication CRD spec.sparkConf, or at runtime via SparkSession
# .config() calls.
#
# Naming convention for placeholders: ${ENV_VAR_NAME}
# Spark resolves these from the environment at driver startup when prefixed
# with "spark.hadoop.env." or when set as actual environment variables via
# spark-env.sh. For OpenLineage transport URL, the env var is read directly
# by the OpenLineage client, not by Spark.
# =============================================================================

# =============================================================================
# ADLS Gen2 / ABFS — Authentication via Azure Workload Identity
#
# The hadoop-azure library reads the workload identity token from the
# projected service account token volume at:
#   /var/run/secrets/azure/tokens/azure-identity-token
#
# This is mounted automatically by the Azure Workload Identity webhook when
# the pod service account has the correct azure.workload.identity/use: "true"
# annotation.
# =============================================================================

# Use Managed Identity (workload identity) for ALL Azure storage accounts.
# This is a global default — account-specific overrides can be set with
# spark.hadoop.fs.azure.account.auth.type.<account-name>.dfs.core.windows.net
spark.hadoop.fs.azure.account.auth.type                         ManagedIdentity

# ABFS secure (TLS) filesystem implementation for abfss:// URIs
spark.hadoop.fs.abfss.impl                                      org.apache.hadoop.fs.azurebfs.SecureAzureFileSystem

# ABFS non-TLS implementation (abfs://), kept for completeness
spark.hadoop.fs.abfs.impl                                       org.apache.hadoop.fs.azurebfs.AzureBlobFileSystem

# Use the OAuth 2.0 endpoint for Managed Identity token acquisition.
# With workload identity federation, no client secret is required —
# the OIDC token is exchanged automatically.
spark.hadoop.fs.azure.account.oauth.provider.type               org.apache.hadoop.fs.azurebfs.oauth2.WorkloadIdentityTokenProvider

# Maximum number of concurrent connections per ABFS account
spark.hadoop.fs.azure.io.retry.max.retries                      3
spark.hadoop.fs.azure.io.retry.backoff.interval                 500

# Enable hierarchical namespace operations (required for ADLS Gen2 rename/delete)
spark.hadoop.fs.azure.enable.hierarchical.namespace             true

# =============================================================================
# Delta Lake
# =============================================================================

# Register the Delta catalog extension — enables Delta table reads/writes
# via the built-in catalog (spark.sql.catalog.spark_catalog)
spark.sql.extensions                                            io.delta.sql.DeltaSparkSessionExtension

# Use Delta's catalog implementation for the default Spark catalog
spark.sql.catalog.spark_catalog                                 org.apache.spark.sql.delta.catalog.DeltaCatalog

# Delta log cache — reduce redundant log reads on large tables
spark.databricks.delta.logRetention.duration                    interval 30 days

# Optimistic concurrency control — number of retries for conflicting MERGE
spark.databricks.delta.retryWriteConflict.limit                 5

# Enable change data feed by default on new Delta tables
# Individual tables override this via ALTER TABLE ... SET TBLPROPERTIES
spark.databricks.delta.properties.defaults.enableChangeDataFeed true

# Auto-compact small files during writes (reduces file count without OPTIMIZE)
spark.databricks.delta.autoCompact.enabled                      true

# =============================================================================
# Spark on Kubernetes — resource and scheduling defaults
# These are conservative defaults. SparkApplication CRDs override per job.
# =============================================================================

# Kubernetes namespace for driver/executor pods
# Overridden at job submission by SparkApplication .spec.namespace
spark.kubernetes.namespace                                      spark-jobs

# Use the in-cluster service account token for Kubernetes API calls
spark.kubernetes.authenticate.driver.serviceAccountName         spark

# Container image — overridden at submission by SparkApplication .spec.image
# This value is the fallback if not specified in the CRD
spark.kubernetes.container.image                                forgeacr-dev.azurecr.io/spark:4.1.0-dev

# Pull policy — Always ensures the latest pushed image is used
spark.kubernetes.container.image.pullPolicy                     Always

# =============================================================================
# Executor sizing defaults
# These are conservative baselines. Data-intensive jobs override via CRD.
# =============================================================================

# Default executor memory
spark.executor.memory                                           4g

# Memory overhead: 10% of executor memory, minimum 384 MB
# Required for off-heap memory (native Arrow, Python UDFs, etc.)
spark.executor.memoryOverheadFactor                             0.1
spark.executor.memoryOverhead                                   512m

# Default executor cores
spark.executor.cores                                            2

# Default driver memory
spark.driver.memory                                             2g
spark.driver.memoryOverhead                                     512m

# =============================================================================
# Dynamic Allocation
# Allows executors to be released when idle and requested on demand.
# Works with the Kubernetes ExecutorPodAllocation strategy.
# =============================================================================

spark.dynamicAllocation.enabled                                 true
spark.dynamicAllocation.shuffleTracking.enabled                 true
spark.dynamicAllocation.minExecutors                            1
spark.dynamicAllocation.maxExecutors                            20
spark.dynamicAllocation.initialExecutors                        2
spark.dynamicAllocation.executorIdleTimeout                     120s
spark.dynamicAllocation.cachedExecutorIdleTimeout               600s

# =============================================================================
# Shuffle
# =============================================================================

# Adaptive Query Execution — automatically optimises shuffle partitions,
# skew joins, and coalesce partitions based on runtime statistics
spark.sql.adaptive.enabled                                      true
spark.sql.adaptive.coalescePartitions.enabled                   true
spark.sql.adaptive.skewJoin.enabled                             true

# Default shuffle partitions (AQE will reduce this automatically post-shuffle)
spark.sql.shuffle.partitions                                    200

# Local shuffle service is not used in K8s mode; use shuffle tracking instead
spark.shuffle.service.enabled                                   false

# =============================================================================
# OpenLineage — Automatic lineage emission
#
# The OpenLineage Spark listener emits START/COMPLETE/FAIL events to Marquez
# via HTTP. The transport URL is injected at runtime via the OPENLINEAGE_URL
# environment variable set by the SparkApplication CRD or Helm values.
#
# The OpenLineage client reads OPENLINEAGE_URL directly from the environment,
# but we also set it here as spark.openlineage.transport.url so it is visible
# in the Spark configuration history.
# =============================================================================

# Register the OpenLineage Spark listener
spark.extraListeners                                            io.openlineage.spark.agent.OpenLineageSparkListener

# Transport type: HTTP (posts events to Marquez API)
spark.openlineage.transport.type                                http

# Marquez API endpoint — resolved from OPENLINEAGE_URL env var at runtime.
# Override this in SparkApplication CRD spec.sparkConf if the env var
# approach is not used.
# spark.openlineage.transport.url                               http://marquez-api.lineage.svc.cluster.local:5000

# Namespace for lineage events — matches the Forge environment
spark.openlineage.namespace                                     forge

# Emit column-level lineage (requires Spark 3.x and Delta Lake)
spark.openlineage.columnLineage.enabled                         true

# =============================================================================
# Serialization
# =============================================================================

# Kryo serializer is faster and more compact than Java default
spark.serializer                                                org.apache.spark.serializer.KryoSerializer
spark.kryo.registrationRequired                                 false

# =============================================================================
# Event logging (Spark History Server)
# Set spark.eventLog.dir to the ADLS path in the SparkApplication CRD.
# =============================================================================

spark.eventLog.enabled                                          true
# spark.eventLog.dir                                          abfss://platform@<account>.dfs.core.windows.net/spark-history
spark.eventLog.compress                                         true
spark.eventLog.rolling.enabled                                  true
spark.eventLog.rolling.maxFileSize                              128m

# =============================================================================
# UI
# =============================================================================

# Reduce UI retention to avoid memory pressure on long-running jobs
spark.ui.retainedJobs                                           200
spark.ui.retainedStages                                         500
spark.ui.retainedTasks                                          1000
spark.sql.ui.retainedExecutions                                 200
