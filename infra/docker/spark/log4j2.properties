# =============================================================================
# Stratum — Spark Log4j2 Configuration
# Reduces noise from Azure/Hadoop ABFS libraries while keeping useful
# Spark application logs at INFO.
# =============================================================================

# Root logger
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console

# Console appender with pattern layout
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %p %c{1.}: %m%n

# Spark — INFO level for application code
logger.spark.name = org.apache.spark
logger.spark.level = INFO

# Spark SQL — WARN to reduce shuffle/catalyst verbose output
logger.sparksql.name = org.apache.spark.sql
logger.sparksql.level = WARN

# Hadoop — WARN to suppress ABFS retry / configuration noise
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

# Azure ABFS driver — WARN
logger.abfs.name = org.apache.hadoop.fs.azurebfs
logger.abfs.level = WARN

# Azure Identity — WARN (suppress token refresh INFO messages)
logger.azureidentity.name = com.azure.identity
logger.azureidentity.level = WARN

# Azure Core — WARN
logger.azurecore.name = com.azure.core
logger.azurecore.level = WARN

# Delta Lake — INFO
logger.delta.name = io.delta
logger.delta.level = INFO

# OpenLineage — INFO
logger.openlineage.name = io.openlineage
logger.openlineage.level = INFO

# Kubernetes client — WARN
logger.k8sclient.name = io.fabric8
logger.k8sclient.level = WARN

# Jetty (Spark UI) — WARN
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN
