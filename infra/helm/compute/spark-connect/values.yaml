# =============================================================================
# Spark Connect — Helm Values
#
# Single shared Spark Connect server for the entire team.
# All engineers connect to the same driver via VS Code PySpark extension.
# Executors are shared and scale dynamically with actual query load.
#
# Node type (prod): Standard_E96_v5 (96 vCPUs / 672 GiB RAM per node)
# Executor sizing 4c/28g is the exact fit for E96_v5:
#   96 ÷ 4 = 24 by CPU, 672 ÷ 28 = 24 by RAM → ~22 executors per node after
#   system reserve.
#
# Usage:
#   helm upgrade --install spark-connect infra/helm/compute/spark-connect \
#     --namespace spark-system \
#     --values infra/helm/compute/spark-connect/values.yaml \
#     --set adls.account=forgeadls{alias}{env} \
#     --set image.repository=forgeacr{alias}.azurecr.io/spark
#
#   Dev: append --values infra/helm/compute/spark-connect/values-dev.yaml
# =============================================================================

# Single shared instance — all 15 engineers connect to the same server
nameOverride: spark-connect

image:
  repository: forgeacr.azurecr.io/spark  # override at deploy: --set image.repository=forgeacr{alias}.azurecr.io/spark
  tag: "4.1.1"
  pullPolicy: IfNotPresent

# ----------------------------------------------------------------------------
# Driver pod resources
# Handles session management, query planning, result streaming.
# 8 cores / 28g supports 10+ concurrent active sessions.
# ----------------------------------------------------------------------------
driver:
  cores: 8
  memory: "28g"
  resources:
    requests:
      cpu: "8"
      memory: "30Gi"
    limits:
      cpu: "12"
      memory: "32Gi"
  nodeSelector:
    workload: spark
  tolerations:
    - key: workload
      operator: Equal
      value: spark
      effect: NoSchedule

# ----------------------------------------------------------------------------
# Dynamic executor allocation
# E96_v5 (96 vCPUs / 672 GiB) — 4 cores / 28g is the natural fit:
#   96 vCPUs ÷ 4 = 24 by CPU, 672 GiB ÷ 28 = 24 by RAM → zero waste per node.
#   After system reserve (~4 vCPUs / 16 GiB): ~22 executors per node.
# Executors scale with actual query load — idle executors are released.
# ----------------------------------------------------------------------------
executor:
  cores: 4
  memory: "28g"
  instances:
    min: 2
    max: 40
  resources:
    requests:
      cpu: "4"
      memory: "30Gi"
    limits:
      cpu: "4"
      memory: "30Gi"
  nodeSelector:
    workload: spark
  tolerations:
    - key: workload
      operator: Equal
      value: spark
      effect: NoSchedule

# ----------------------------------------------------------------------------
# Spark Connect gRPC service
# Internal load balancer — accessible from VNet / VPN only.
# Each instance gets its own LB IP so engineers connect to either instance.
# ----------------------------------------------------------------------------
service:
  type: LoadBalancer
  port: 15002
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-forge-compute-{env}"

# ----------------------------------------------------------------------------
# Spark configuration
# ----------------------------------------------------------------------------
sparkConf:
  # ADLS Gen2 — workload identity
  spark.hadoop.fs.azure.account.auth.type: "OAuth"
  spark.hadoop.fs.azure.account.oauth.provider.type: "org.apache.hadoop.fs.azurebfs.oauth2.WorkloadIdentityTokenProvider"

  # Delta Lake
  spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
  spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"

  # Dynamic allocation — scales executors with actual load
  spark.dynamicAllocation.enabled: "true"
  spark.dynamicAllocation.shuffleTracking.enabled: "true"
  spark.dynamicAllocation.minExecutors: "2"
  spark.dynamicAllocation.maxExecutors: "40"
  spark.dynamicAllocation.executorIdleTimeout: "120s"

  # OpenLineage — disabled for Spark Connect. spark-defaults.conf in the image enables it
  # but without a transport URL executors crash on initialization. Lineage for interactive
  # sessions is a prod concern; batch jobs via SparkApplication CRDs emit lineage instead.
  spark.extraListeners: ""
  spark.openlineage.transport.type: ""

  # Executor pod template — provides tolerations so executors schedule on tainted spark nodes
  spark.kubernetes.executor.podTemplateFile: "/opt/spark/conf/executor-pod-template.yaml"

  # Disable local event log — spark-defaults.conf in the image sets file:/tmp/spark-events
  # which does not exist in the container. Event history is a prod concern (log to ADLS).
  spark.eventLog.enabled: "false"

# ----------------------------------------------------------------------------
# ADLS account (set per environment at deploy time)
# ----------------------------------------------------------------------------
adls:
  account: ""  # set via --set adls.account=forgeadls{alias}dev

# ----------------------------------------------------------------------------
# Workload identity — client ID injected at deploy time
# ----------------------------------------------------------------------------
serviceAccount:
  create: false      # created by identity Bicep module
  name: spark
  annotations: {}    # azure.workload.identity/client-id set at deploy time
