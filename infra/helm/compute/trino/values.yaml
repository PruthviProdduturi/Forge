# =============================================================================
# Trino — Helm Values
#
# Chart is pulled from ACR OCI registry (imported in Step 02):
#   helm upgrade --install trino \
#     oci://forgeacr{alias}.azurecr.io/helm/trino \
#     --version 1.36.0 \
#     --namespace trino --create-namespace \
#     --values infra/helm/compute/trino/values.yaml \
#     --set image.repository=forgeacr{alias}.azurecr.io/trino \
#     --set image.tag=479 \
#     --set serviceAccount.annotations."azure\.workload\.identity/client-id"=${WI_CLIENT_ID}
#
# WI_CLIENT_ID is the clientId of id-forge-trino-{env} managed identity.
# =============================================================================

image:
  repository: forgeacr.azurecr.io/trino
  tag: "479"
  pullPolicy: IfNotPresent

# ----------------------------------------------------------------------------
# Coordinator — always-on, handles query planning and client connections
# ----------------------------------------------------------------------------
coordinator:
  jvm:
    maxHeapSize: "6G"
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  nodeSelector:
    agentpool: trinopool
  tolerations:
    - key: workload
      operator: Equal
      value: trino
      effect: NoSchedule
  # Trino runs plain HTTP internally — TLS and OAuth2 are handled by trino-auth-proxy.

# ----------------------------------------------------------------------------
# Workers — autoscaled 2–8 based on active query count (HPA)
# Dev sizing: D4s_v5 (4 vCPU / 16 GiB per node)
# ----------------------------------------------------------------------------
worker:
  replicas: 5
  jvm:
    maxHeapSize: "7G"
  resources:
    requests:
      cpu: "2"
      memory: "9Gi"
    limits:
      cpu: "4"
      memory: "9Gi"
  nodeSelector:
    agentpool: trinopool
  tolerations:
    - key: workload
      operator: Equal
      value: trino
      effect: NoSchedule

# ----------------------------------------------------------------------------
# Autoscaling
# ----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

# ----------------------------------------------------------------------------
# Catalogs
# HMS Thrift endpoint: hive-metastore.hive-metastore.svc.cluster.local:9083
# ----------------------------------------------------------------------------
additionalCatalogs:
  lakehouse: |
    connector.name=delta_lake
    hive.metastore.uri=thrift://hive-metastore.hive-metastore.svc.cluster.local:9083
    delta.hive-catalog-name=hive
    fs.native-azure.enabled=true
    azure.auth-type=DEFAULT

  hive: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore.hive-metastore.svc.cluster.local:9083
    fs.native-azure.enabled=true
    azure.auth-type=DEFAULT

# ----------------------------------------------------------------------------
# Workload identity — client ID set at deploy time via --set
# ----------------------------------------------------------------------------
serviceAccount:
  create: false    # created by identity Bicep module
  name: trino
  annotations: {}  # azure.workload.identity/client-id set at deploy time

# Pod labels required for workload identity token injection
podLabels:
  azure.workload.identity/use: "true"

# ----------------------------------------------------------------------------
# Additional coordinator-only config properties (server.coordinatorExtraConfig).
# web-ui.authentication.type=fixed  — accepts any username without password;
#   real auth is enforced by trino-auth-proxy (X-Trino-User on API paths).
# web-ui.user=trino-user            — required when type=fixed (non-null check).
# http-server.process-forwarded=true — honour X-Forwarded-* from nginx ingress;
#   without this Trino rejects requests with X-Forwarded-For headers (406).
# Workers do not need these — only the coordinator accepts web traffic.
# ----------------------------------------------------------------------------
server:
  coordinatorExtraConfig: |
    web-ui.authentication.type=fixed
    web-ui.user=trino-user
    http-server.process-forwarded=true

# ----------------------------------------------------------------------------
# Service — ClusterIP (internal only).
# Access goes through trino-auth-proxy via HTTPS ingress.
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
