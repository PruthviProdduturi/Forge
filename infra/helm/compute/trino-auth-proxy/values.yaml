# =============================================================================
# trino-auth-proxy — Helm Values
#
# Access model: https://<compute-host>/ui/  (HTTPS via ingress-nginx + cert-manager)
# Same pattern as portal-auth-proxy on the orchestration cluster.
#
# Deploy:
#   bash infra/scripts/forge-up.sh --env dev --alias prproddu
#
# Prerequisites:
#   - K8s secret: proxy-session-secret  (key: session-secret)
#   - App reg FC: issuer=https://login.microsoftonline.com/<tenant>/v2.0
#                 subject=<managed identity principalId>
#   - cert-manager installed on compute cluster with letsencrypt ClusterIssuer
# =============================================================================

image:
  repository: forgeacr.azurecr.io/trino-auth-proxy
  tag: "1.2"
  pullPolicy: Always

replicaCount: 1

serviceAccount:
  name: oauth2-proxy-sa
  annotations: {}  # azure.workload.identity/client-id set at deploy time

env:
  tenantId: ""
  clientId: ""
  redirectUri: ""
  allowedDomain: "microsoft.com"
  trinoBackend: "trino:8080"
  managedIdentityClientId: ""

sessionSecret:
  secretName: proxy-session-secret
  key: session-secret

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

nodeSelector:
  agentpool: trinopool

tolerations:
  - key: workload
    operator: Equal
    value: trino
    effect: NoSchedule

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# ---------------------------------------------------------------------------
# Ingress — HTTPS via ingress-nginx + cert-manager/Let's Encrypt
# Same pattern as portal helm chart.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # Public hostname — set by forge-up.sh at deploy time.
  # e.g. forge-compute-prproddudev.westcentralus.cloudapp.azure.com
  host: ""
  tls:
    enabled: true
    secretName: forge-trino-tls
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
