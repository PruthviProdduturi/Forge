# =============================================================================
# Spark Operator — Helm Values (chart 2.5.0)
#
# Image schema for this chart:
#   image.*        — controller + webhook pods (same image)
#   hook.image.*   — pre-install/upgrade hook Job (kubectl image)
#   controller.*   / webhook.* — scheduling, resources, config (NOT images)
#
# Both controller and webhook pods use the same image (spark-operator-controller).
# The hook job uses a separate kubectl image (spark-operator-kubectl).
#
# Chart is pulled from ACR OCI registry (imported in Step 06):
#   helm upgrade --install spark-operator \
#     oci://forgeacr{alias}.azurecr.io/helm/spark-operator \
#     --version 2.5.0 \
#     --namespace spark-system --create-namespace \
#     --values infra/helm/compute/spark-operator/values.yaml
# =============================================================================

# Controller + webhook pod image
image:
  registry: forgeacr.azurecr.io
  repository: spark-operator-controller
  tag: "2.5.0"
  pullPolicy: IfNotPresent

# Pre-install/upgrade hook Job image (kubectl)
hook:
  image:
    registry: forgeacr.azurecr.io
    repository: spark-operator-kubectl
    tag: "2.5.0"

# Watch only the spark-jobs namespace
spark:
  jobNamespaces:
    - spark-jobs

# Webhook enabled, runs on systempool
webhook:
  enable: true
  nodeSelector:
    agentpool: systempool
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Controller runs on systempool — lightweight management component
controller:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector:
    agentpool: systempool
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Prometheus-format metrics scraped by Azure Monitor Agent
prometheus:
  metrics:
    enable: true
    port: 8080
    portName: metrics
    endpoint: /metrics
