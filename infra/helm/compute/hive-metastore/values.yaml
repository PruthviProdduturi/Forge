# =============================================================================
# Hive Metastore — Helm Values
#
# HMS authenticates against PostgreSQL using AAD token exchange (workload
# identity). No password is stored anywhere.
#
# Usage:
#   HMS_HOST=$(az keyvault secret show --vault-name kv-forge-{alias}-{env} \
#     --name hms-postgres-host --query value -o tsv)
#   WI_CLIENT_ID=$(az identity show -g rg-forge-{alias}-{env} \
#     -n id-forge-hms-{env} --query clientId -o tsv)
#
#   helm upgrade --install hive-metastore infra/helm/compute/hive-metastore \
#     --namespace hive-metastore --create-namespace \
#     --set image.repository=forgeacr{alias}.azurecr.io/hive-metastore \
#     --set db.host="${HMS_HOST}" \
#     --set db.user="id-forge-hms-{env}" \
#     --set adls.account=forgeadls{alias}{env} \
#     --set serviceAccount.annotations."azure\.workload\.identity/client-id"="${WI_CLIENT_ID}" \
#     --wait --timeout 5m
# =============================================================================

image:
  repository: forgeacr.azurecr.io/hive-metastore
  tag: "3.1.3"
  pullPolicy: IfNotPresent

# ----------------------------------------------------------------------------
# PostgreSQL connection — host and user set at deploy time from Key Vault / CLI
# No password — AAD token exchange via workload identity
# ----------------------------------------------------------------------------
db:
  host: ""    # set via --set db.host=...
  port: 5432
  name: hms_db
  user: ""    # set via --set db.user=id-forge-hms-{env}

# ----------------------------------------------------------------------------
# ADLS warehouse directory — default table root (path pointer only)
# ----------------------------------------------------------------------------
adls:
  account: ""    # set via --set adls.account=forgeadls{alias}{env}

# ----------------------------------------------------------------------------
# Resources — HMS is a metadata server, not a query engine
# ----------------------------------------------------------------------------
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

nodeSelector:
  agentpool: systempool

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

replicaCount: 1

service:
  port: 9083

# ----------------------------------------------------------------------------
# Workload identity — client ID injected at deploy time via --set
# Service account created by identity Bicep module (namespace: hive-metastore)
# ----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: hive-metastore
  annotations: {}    # azure.workload.identity/client-id set at deploy time
