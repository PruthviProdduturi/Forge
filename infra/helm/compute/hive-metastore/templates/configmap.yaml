apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: hive-metastore
    app.kubernetes.io/managed-by: Helm
data:
  metastore-site.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration>
      <!-- PostgreSQL backend — AAD token authentication via workload identity.
           Values are rendered by Helm at deploy time ({{ .Values.db.host }} etc.).
           Do NOT use $(DB_HOST) env var syntax here — Kubernetes only substitutes
           env vars in command/args fields, not in mounted ConfigMap files. -->
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}?sslmode=require&amp;authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>{{ .Values.db.user }}</value>
      </property>
      <!-- No ConnectionPassword — AAD plugin handles token exchange using AZURE_CLIENT_ID -->

      <!-- Schema management -->
      <property>
        <name>datanucleus.schema.autoCreateAll</name>
        <value>false</value>
      </property>
      <property>
        <name>hive.metastore.schema.verification</name>
        <value>false</value>
      </property>

      <!-- Thrift server -->
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://0.0.0.0:{{ .Values.service.port }}</value>
      </property>
      <property>
        <name>hive.metastore.port</name>
        <value>{{ .Values.service.port }}</value>
      </property>

      <!-- Warehouse dir: local path so HMS does not try to initialise ABFS on startup.
           HMS is a pure metadata store — it writes table metadata to Postgres and stores
           LOCATION strings as-is. Spark/Trino access ADLS directly with their own creds;
           HMS never reads from the warehouse dir itself. External tables always supply an
           explicit abfss:// LOCATION, so this default is only used for managed tables
           (which we avoid). A local path eliminates the azure-identity classpath dependency. -->
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>file:///opt/hive/data/warehouse</value>
      </property>
    </configuration>
