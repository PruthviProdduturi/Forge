# =============================================================================
# ingress-nginx — Helm Values for Forge Compute Cluster
#
# Single public IP for all compute services:
#   80/443 → trino-auth-proxy (HTTP Ingress, TLS via cert-manager)
#   9083   → hive-metastore   (Thrift, TCP proxy)
#   15002  → spark-connect    (gRPC, TCP proxy)
#
# Trino is now served via HTTPS Ingress (same pattern as portal) instead of
# raw TCP port 8080. Access: https://<compute-host>/ui/
#
# DNS label set at deploy time via --set:
#   forge-compute-{alias}-{env}.{region}.cloudapp.azure.com
# =============================================================================

controller:
  replicaCount: 1

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-dns-label-name: ""   # overridden by --set at deploy time
      # K8s 1.24+: AKS ignores the tcp protocol override for ports 80/443 and forces HTTP/HTTPS probes.
      # Without a request path, the probe hits / → ingress returns 308/404 → LB marks backend unhealthy.
      # /healthz is served by ingress-nginx on port 80 and always returns 200.
      service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "tcp"
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
    # Expose TCP ports alongside 80/443
    ports:
      http: 80
      https: 443
    targetPorts:
      http: http
      https: https

  # TCP port mappings — proxied by nginx to ClusterIP services
  # ConfigMap is created by the tcp section below
  extraArgs:
    tcp-services-configmap: "$(POD_NAMESPACE)/tcp-services"

  # Schedule on the compute worker pool (spark nodes would work but systempool is safer)
  nodeSelector:
    kubernetes.io/os: linux
    agentpool: systempool

  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"

  admissionWebhooks:
    enabled: false

defaultBackend:
  enabled: true
  replicaCount: 1
  nodeSelector:
    kubernetes.io/os: linux
    agentpool: systempool
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# TCP services — raw TCP proxied to ClusterIP services (non-HTTP protocols)
# Trino UI/API is no longer here — it uses HTTP Ingress (port 80/443) instead.
tcp:
  9083: "hive-metastore/hive-metastore:9083"
  15002: "spark-system/spark-connect:15002"
