# =============================================================================
# Apache Airflow — Helm Values (chart 1.20.0 / Airflow 3.1.8)
#
# Deployed via forge-up.sh — do not run helm directly.
# forge-up.sh creates all prerequisite K8s secrets before this chart installs.
#
# Prerequisite secrets (created by forge-up.sh):
#   airflow-db-credentials      → key: connection  (full SQLAlchemy URL with AAD token)
#   airflow-webserver-secret    → key: webserver-secret-key
#   airflow-git-credentials     → keys: GIT_SYNC_USERNAME, GITSYNC_USERNAME,
#                                        GIT_SYNC_PASSWORD, GITSYNC_PASSWORD
#   airflow-compute-kubeconfig  → key: config  (compute cluster kubeconfig)
#   airflow-oauth-credentials   → key: client-id  (app reg client ID; no secret —
#                                        workload identity federated token used instead)
#
# AAD token strategy:
#   forge-up.sh pre-injects an AAD token into airflow-db-credentials before helm
#   runs (so migrateDatabaseJob can connect). The secret is mounted as a volume
#   at /opt/airflow/db-secret/. AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD reads
#   from this file — Kubernetes auto-refreshes mounted secrets within ~1 min of
#   a secret update, so the airflow-token-refresh CronJob (also deployed by
#   forge-up.sh) keeps connections alive across the 1h token expiry window.
#   pool_recycle (3000s) ensures new connections are opened before 1h is up.
#
# Image pulled from ACR (no public registry access):
#   oci://forgeacr{alias}.azurecr.io/helm/airflow:1.20.0
#   forgeacr{alias}.azurecr.io/airflow:3.1.8
# =============================================================================

# ---------------------------------------------------------------------------
# Executor — LocalExecutor for dev (tasks run inside the scheduler process)
# Switch to KubernetesExecutor in prod (separate pod per task)
# SparkKubernetesOperator works with any executor — it always talks to the
# compute cluster via the kubernetes_compute_cluster Airflow connection.
# ---------------------------------------------------------------------------
executor: "LocalExecutor"

# ---------------------------------------------------------------------------
# Images — all pulled from ACR
# ---------------------------------------------------------------------------
images:
  airflow:
    repository: forgeacr.azurecr.io/airflow   # overridden at deploy time
    tag: "3.1.8"
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Metadata DB — external PostgreSQL Flexible Server (AAD-only, no password)
#
# metadataSecretName is set to ~ (null) so the chart does NOT inject
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN directly from the secret. Instead, we use
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD (below) to read from the mounted
# secret file. This allows the CronJob to refresh the token in the secret and
# have all Airflow processes pick up the new value automatically (Kubernetes
# refreshes mounted secret files within ~1 min; pool_recycle handles the rest).
# ---------------------------------------------------------------------------
postgresql:
  enabled: false

data:
  # Chart injects AIRFLOW__DATABASE__SQL_ALCHEMY_CONN via secretKeyRef on all
  # containers (including init containers like wait-for-airflow-migrations).
  # The token-init Job (forge-up.sh [7.0]) pre-populates this secret with a
  # fresh AAD token before helm runs. The token-refresh CronJob ([7.4]) keeps
  # it current — pods pick up the new token on their next restart.
  metadataSecretName: airflow-db-credentials

# Connection pool: recycle before the AAD token expires (1h = 3600s, recycle at 50min)
config:
  database:
    sql_alchemy_pool_recycle: "3000"
    sql_alchemy_pool_pre_ping: "True"
  api:
    # Bearer JWT auth — portal backend POSTs /auth/token (portal-api-svc credentials
    # from KV) to get an Airflow JWT, then passes it as Authorization: Bearer.
    auth_backends: "airflow.api.auth.backend.bearer_auth"
  core:
    # Dev guardrails — keep dev cheap and predictable.
    # 10 DAGs max; no historical backfill; DAGs auto-expire after 5 days.
    parallelism: "20"                   # max concurrent tasks across all DAGs (10 jobs × 2)
    max_active_tasks_per_dag: "5"       # per-DAG task concurrency cap
    max_active_runs_per_dag: "2"        # per-DAG concurrent run cap
    catchup_by_default: "False"         # never backfill missed runs
    dag_policy_package_name: "forge_dev_policy"  # enforces 5-day end_date on every DAG
  scheduler:
    parsing_processes: "2"              # 2 parsers sufficient for ≤10 DAGs

# ---------------------------------------------------------------------------
# DAG delivery — git-sync from DSEngCoreData (user pipeline repo)
# forge-up.sh creates the airflow-git-credentials secret with PAT token.
# Syncs every 30s; subPath must point to the dags folder inside the repo.
# ---------------------------------------------------------------------------
dags:
  gitSync:
    enabled: false
    repo: "https://dev.azure.com/L1R/Data%20Science%20Engineering/_git/DSEngCoreData"  # configurable via --git-repo
    branch: "main"  # configurable via --git-branch
    subPath: "sources/dev/CoreData/src"
    depth: 1
    credentialsSecret: airflow-git-credentials
    period: 30s

# ---------------------------------------------------------------------------
# Ingress — public HTTPS access to Airflow UI
# Host is overridden at deploy time: --set ingress.apiServer.host=forge-airflow-{alias}{env}.{loc}.cloudapp.azure.com
# Note: Airflow chart 1.14+ uses ingress.apiServer (not ingress.web) for Airflow 3.x.
# ---------------------------------------------------------------------------
ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    host: forge-airflow-dev.westcentralus.cloudapp.azure.com  # overridden by forge-up.sh
    tls:
      enabled: true
      secretName: forge-airflow-tls
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

# ---------------------------------------------------------------------------
# Webserver
# ---------------------------------------------------------------------------
# Webserver secret key — moved to root level in chart 1.14+ (removed from webserver block)
webserverSecretKeySecretName: airflow-webserver-secret
webserverSecretKeySecretKey: webserver-secret-key

webserver:
  replicas: 1
  service:
    type: ClusterIP
  waitForMigrations:
    enabled: false
  # No local admin — portal backend uses workload identity token (Bearer auth)
  defaultUser:
    enabled: false

# ---------------------------------------------------------------------------
# Scheduler — single replica for dev (HA: 2 replicas in prod)
# ---------------------------------------------------------------------------
scheduler:
  replicas: 1
  waitForMigrations:
    enabled: false
  labels:
    azure.workload.identity/use: "true"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

# ---------------------------------------------------------------------------
# Triggerer — handles deferred operators
# ---------------------------------------------------------------------------
triggerer:
  enabled: true
  replicas: 1
  waitForMigrations:
    enabled: false
  labels:
    azure.workload.identity/use: "true"

# ---------------------------------------------------------------------------
# DAG Processor — Airflow 3.x requires a separate dag-processor component
# ---------------------------------------------------------------------------
dagProcessor:
  enabled: true
  replicas: 1
  waitForMigrations:
    enabled: false
  labels:
    azure.workload.identity/use: "true"
  # Use the main 'airflow' SA — it has the federated identity credential registered in AAD.
  # The auto-created airflow-dag-processor SA has no federation record and WI auth fails.
  serviceAccount:
    create: false
    name: airflow
  # DAGs are stored in ADLS (code/dags/*.py) and restored here on pod start.
  # The emptyDir is shared between the dag-restore init container and the dag-processor.
  # sync-jobs.sh uploads DAGs to ADLS; this init container pulls them on every pod restart.
  extraVolumes:
    - name: dags
      emptyDir: {}
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
  extraInitContainers:
    - name: dag-restore
      # Image is overridden by forge-up.sh --set to forge-airflow ACR image.
      # The forge-airflow image has azure-storage-blob + azure-identity installed.
      # Placeholder here prevents Helm validation errors if --set is omitted.
      image: "apache/airflow:3.1.8-python3.11"
      command:
        - python3
        - "-c"
        - |
          import os, sys
          storage = os.environ.get("FORGE_STORAGE_ACCOUNT", "")
          if not storage:
              print("WARN: FORGE_STORAGE_ACCOUNT not set — skipping DAG restore", flush=True)
              sys.exit(0)
          try:
              from azure.storage.blob import BlobServiceClient
              from azure.identity import DefaultAzureCredential
          except ImportError:
              print("WARN: azure packages not available in image — skipping DAG restore", flush=True)
              sys.exit(0)
          os.makedirs("/opt/airflow/dags", exist_ok=True)
          cred = DefaultAzureCredential()
          client = BlobServiceClient(
              account_url=f"https://{storage}.blob.core.windows.net",
              credential=cred,
          )
          container_client = client.get_container_client("code")
          restored = 0
          for blob in container_client.list_blobs(name_starts_with="dags/"):
              name = blob.name[len("dags/"):]
              if not name or not name.endswith(".py") or "/" in name:
                  continue
              data = container_client.get_blob_client(blob.name).download_blob().readall()
              with open(f"/opt/airflow/dags/{name}", "wb") as f:
                  f.write(data)
              print(f"  restored: {name}", flush=True)
              restored += 1
          print(f"dag-restore: {restored} DAG(s) restored from {storage}/code/dags/", flush=True)
      envFrom:
        - configMapRef:
            name: forge-platform-config
      volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags

apiServer:
  waitForMigrations:
    enabled: false
  # Use the main 'airflow' SA which has the federated identity credential for workload identity.
  # The auto-created airflow-api-server SA has no federated credential.
  serviceAccount:
    create: false
    name: airflow
  labels:
    azure.workload.identity/use: "true"

# ---------------------------------------------------------------------------
# Workers — not used with LocalExecutor
# ---------------------------------------------------------------------------
workers:
  replicas: 0

# ---------------------------------------------------------------------------
# Flower — not used (no CeleryExecutor)
# ---------------------------------------------------------------------------
flower:
  enabled: false

# ---------------------------------------------------------------------------
# Migrate DB Job — needs the DB secret mounted so SQL_ALCHEMY_CONN_CMD works.
# forge-up.sh pre-injects the AAD token into airflow-db-credentials before
# this Job runs, so the migration can connect to Postgres on first deploy.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# AAD OAuth webserver config
# Uses Microsoft as the OAuth provider. client_id and client_secret are
# injected via env vars from the airflow-oauth-credentials K8s secret.
# Prerequisite: create client secret on app reg d0ce7c35-... and store in
# Key Vault as forge-airflow-oauth-secret.
# ---------------------------------------------------------------------------
webserverConfig: |
  import os
  import logging
  from flask_appbuilder.security.manager import AUTH_OAUTH

  log = logging.getLogger(__name__)

  AUTH_TYPE = AUTH_OAUTH
  AUTH_USER_REGISTRATION = True
  AUTH_USER_REGISTRATION_ROLE = "Viewer"
  AUTH_ROLES_SYNC_AT_LOGIN = True

  _tenant = os.environ.get("AZURE_TENANT_ID", "common")
  _client_id = os.environ.get("AIRFLOW__WEBSERVER__OAUTH_CLIENT_ID", "")

  OAUTH_PROVIDERS = [
    {
      "name": "microsoft",
      "icon": "fa-windows",
      "token_key": "access_token",
      "remote_app": {
        "client_id": _client_id,
        "api_base_url": f"https://login.microsoftonline.com/{_tenant}/oauth2/v2.0/",
        "access_token_url": f"https://login.microsoftonline.com/{_tenant}/oauth2/v2.0/token",
        "authorize_url": f"https://login.microsoftonline.com/{_tenant}/oauth2/v2.0/authorize",
        "jwks_uri": f"https://login.microsoftonline.com/{_tenant}/discovery/v2.0/keys",
        "request_token_url": None,
        "client_kwargs": {"scope": "openid profile email"},
      },
    }
  ]

  # ---------------------------------------------------------------------------
  # Workload-identity OAuth manager — same pattern as Trino UI AAD (S360-compliant).
  # Reads AZURE_FEDERATED_TOKEN_FILE (injected by AKS workload identity) and uses
  # it as client_assertion when exchanging the auth code for tokens.
  # No client_secret. No certificate. forge-up.sh registers the matching federated
  # credential on the app registration automatically.
  # ---------------------------------------------------------------------------
  try:
    from airflow.providers.fab.auth_manager.security_manager.override import (
        FabAirflowSecurityManagerOverride as _Base,
    )
  except ImportError:
    from airflow.auth.managers.fab.security_manager.override import (
        FabAirflowSecurityManagerOverride as _Base,
    )

  class WorkloadIdentityOAuthManager(_Base):
    def init_oauth(self):
      super().init_oauth()
      remote = self.oauth_remotes.get("microsoft")
      if remote is None:
        return
      _orig = remote.authorize_access_token
      def _with_fed_assertion(**kwargs):
        fed_path = os.environ.get("AZURE_FEDERATED_TOKEN_FILE", "")
        if fed_path and os.path.exists(fed_path):
          try:
            with open(fed_path) as _f:
              kwargs["client_assertion"] = _f.read().strip()
            kwargs["client_assertion_type"] = (
              "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
            )
          except Exception:
            log.exception("Could not read federated token file")
        else:
          log.warning("AZURE_FEDERATED_TOKEN_FILE not available — token exchange may fail")
        return _orig(**kwargs)
      remote.authorize_access_token = _with_fed_assertion

  CUSTOM_SECURITY_MANAGER = WorkloadIdentityOAuthManager

migrateDatabaseJob:
  # Disabled — migrations are run as a controlled Job in forge-up.sh [7.0]
  # before helm installs pods, so wait-for-airflow-migrations passes immediately.
  enabled: false

# ---------------------------------------------------------------------------
# Compute cluster Airflow connection
#
# SparkKubernetesOperator uses kubernetes_conn_id="kubernetes_compute_cluster"
# to submit SparkApplication CRDs to the compute cluster.
# The kubeconfig is mounted from the airflow-compute-kubeconfig K8s secret.
# ---------------------------------------------------------------------------
env:
  - name: AIRFLOW_CONN_KUBERNETES_COMPUTE_CLUSTER
    value: "kubernetes://?in_cluster=False&kube_config_path=%2Fopt%2Fairflow%2Fkubeconfig%2Fconfig"
  - name: FORGE_ENV
    value: "dev"   # overridden at deploy time
  - name: FORGE_DEV_MAX_DAGS_PER_USER
    value: "5"     # per-user DAG limit in dev; enforced by forge_dev_policy plugin
  - name: FORGE_DEV_MAX_SCHEDULE_DAYS
    value: "5"     # DAGs auto-expire after this many days from start_date
  # SQL_ALCHEMY_CONN_CMD: Airflow evaluates this command to get the connection
  # string. Reading from the mounted secret file means Kubernetes' automatic
  # secret sync (within ~1 min of a secret update) keeps the token fresh.
  # pool_recycle (3000s) ensures connections are dropped and re-opened before
  # the 1h AAD token expiry — new connections call this command for a fresh URL.
  # SQL_ALCHEMY_CONN is injected by the chart via secretKeyRef (metadataSecretName above)
  # Use pod IP as hostname so the log server URL (http://<podIP>:8793/...) is
  # correctly constructed. Without this, Airflow uses socket.getfqdn() which
  # returns empty in K8s, producing broken log URLs like http://:8793/...
  - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
    value: "airflow.utils.net.get_host_ip_address"
  # Remote logging — task logs written to ADLS airflow-logs container via workload identity.
  # Airflow MI must have Storage Blob Data Contributor on forgeadls{alias}{env} (post-provision.sh §5).
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "True"
  - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
    value: "azure_blob_storage_log"
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "wasb://airflow-logs/"
  # wasb connection — account_name only, no key. DefaultAzureCredential uses the
  # workload identity federated token (AZURE_FEDERATED_TOKEN_FILE) for auth.
  # additionally_allowed_tenants="*" required: azure-storage-blob resolves auth against
  # a secondary tenant endpoint when public access is disabled, so we allow all tenants.
  - name: AIRFLOW_CONN_AZURE_BLOB_STORAGE_LOG
    value: '{"conn_type": "wasb", "extra": {"account_name": "forgeadlsdsengdev", "additionally_allowed_tenants": "*"}}'
  # Belt-and-suspenders: set at pod level so DefaultAzureCredential also allows any tenant
  # when the WasbHook creates credentials outside the connection context.
  - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
    value: "*"
extraEnv: |
  - name: AIRFLOW__WEBSERVER__OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: airflow-oauth-credentials
        key: client-id
        optional: true

extraVolumes:
  - name: compute-kubeconfig
    secret:
      secretName: airflow-compute-kubeconfig
  # webserver_config.py — Airflow 3.x chart no longer auto-mounts webserverConfig
  # into the api-server pod. Mount it explicitly so FABAuthManager picks up OAuth.
  - name: webserver-config
    configMap:
      name: airflow-webserver-config
  # forge-airflow-plugin — shadows /opt/airflow/plugins/forge_airflow/operators.py
  # in all Airflow pods (scheduler, dag-processor, api-server). Created by forge-up.sh
  # from orchestration/airflow/plugins/forge_airflow/operators.py so plugin updates
  # propagate within ~60s without an image rebuild.
  - name: forge-airflow-plugin
    configMap:
      name: forge-airflow-plugin

extraVolumeMounts:
  - name: compute-kubeconfig
    mountPath: /opt/airflow/kubeconfig
    readOnly: true
  - name: webserver-config
    mountPath: /opt/airflow/webserver_config.py
    subPath: webserver_config.py
    readOnly: true
  - name: forge-airflow-plugin
    mountPath: /opt/airflow/plugins/forge_airflow/operators.py
    subPath: operators.py
    readOnly: true

# ---------------------------------------------------------------------------
# Pod template for KubernetesExecutor worker pods.
# Airflow 3.x loads KubernetesExecutor as a secondary executor even when the
# primary is LocalExecutor (multi-executor API). Without this, the chart does
# not include pod_template_file.yaml in the airflow-config ConfigMap and the
# scheduler crashes with "IsADirectoryError" when trying to enqueue a task.
# ---------------------------------------------------------------------------
podTemplate: |
  apiVersion: v1
  kind: Pod
  metadata:
    name: dummy
    labels:
      azure.workload.identity/use: "true"
  spec:
    serviceAccountName: airflow
    restartPolicy: Never
    containers:
      - name: base
        image: forgeacr.azurecr.io/airflow:3.1.8
        imagePullPolicy: IfNotPresent
        env:
          - name: AIRFLOW_CONN_KUBERNETES_COMPUTE_CLUSTER
            value: "kubernetes://?in_cluster=False&kube_config_path=%2Fopt%2Fairflow%2Fkubeconfig%2Fconfig"
          - name: FORGE_ENV
            value: "dev"
          - name: AIRFLOW__CORE__HOSTNAME_CALLABLE
            value: "airflow.utils.net.get_host_ip_address"
          - name: AIRFLOW__LOGGING__REMOTE_LOGGING
            value: "True"
          - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
            value: "azure_blob_storage_log"
          - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
            value: "wasb://airflow-logs/"
          - name: AIRFLOW_CONN_AZURE_BLOB_STORAGE_LOG
            value: '{"conn_type": "wasb", "extra": {"account_name": "forgeadlsdsengdev", "additionally_allowed_tenants": "*"}}'
          - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
            value: "*"
          # Explicit AZURE_CLIENT_ID — AKS workload identity webhook injects AZURE_FEDERATED_TOKEN_FILE
          # and AZURE_TENANT_ID but not always AZURE_CLIENT_ID. Set explicitly so DefaultAzureCredential
          # uses WorkloadIdentityCredential for ADLS log uploads.
          # Overridden at deploy time via forge-up.sh --set env[100].value=${AIRFLOW_WI_CLIENT_ID}
          - name: AZURE_CLIENT_ID
            value: "overridden-at-deploy-time"
          - name: AIRFLOW_HOME
            value: /opt/airflow
          - name: AIRFLOW__CORE__FERNET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-fernet-key
                key: fernet-key
          - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            valueFrom:
              secretKeyRef:
                name: airflow-db-credentials
                key: connection
          - name: AIRFLOW_CONN_AIRFLOW_DB
            valueFrom:
              secretKeyRef:
                name: airflow-db-credentials
                key: connection
          - name: AIRFLOW__API__SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: airflow-api-secret-key
                key: api-secret-key
          - name: AIRFLOW__API_AUTH__JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: airflow-jwt-secret
                key: jwt-secret
        volumeMounts:
          - name: config
            mountPath: /opt/airflow/airflow.cfg
            subPath: airflow.cfg
            readOnly: true
          - name: config
            mountPath: /opt/airflow/config/airflow_local_settings.py
            subPath: airflow_local_settings.py
            readOnly: true
          - name: compute-kubeconfig
            mountPath: /opt/airflow/kubeconfig
            readOnly: true
          - name: forge-airflow-plugin
            mountPath: /opt/airflow/plugins/forge_airflow/operators.py
            subPath: operators.py
            readOnly: true
    volumes:
      - name: config
        configMap:
          name: airflow-config
      - name: compute-kubeconfig
        secret:
          secretName: airflow-compute-kubeconfig
      - name: forge-airflow-plugin
        configMap:
          name: forge-airflow-plugin

# ---------------------------------------------------------------------------
# Logs — stdout (captured by Azure Monitor Agent → Log Analytics)
# ---------------------------------------------------------------------------
logs:
  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# Redis — not used (no CeleryExecutor)
# ---------------------------------------------------------------------------
redis:
  enabled: false

# ---------------------------------------------------------------------------
# StatsD — disabled for dev
# ---------------------------------------------------------------------------
statsd:
  enabled: false

# ---------------------------------------------------------------------------
# Kubernetes RBAC — needed for KubernetesExecutor task pods (and for
# SparkKubernetesOperator to create SparkApplication CRDs via the connection)
# ---------------------------------------------------------------------------
rbac:
  create: true

serviceAccount:
  create: true
  name: airflow
