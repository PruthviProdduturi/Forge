# =============================================================================
# ingress-nginx — Helm Values for Forge Orchestration Cluster
#
# Single public IP for all orchestration services:
#   80    → forge-portal (HTTP Ingress, portal web + API)
#   8080  → airflow-webserver (TCP proxy — AAD-protected via WorkloadIdentity)
#
# DNS label set at deploy time via --set:
#   forge-portal-{alias}-{env}.{region}.cloudapp.azure.com
# =============================================================================

controller:
  replicaCount: 2

  # Azure LoadBalancer — public IP with DNS label
  service:
    type: LoadBalancer
    annotations:
      # Set at deploy time: forge-portal-{alias}-{env}
      # Results in: forge-portal-prproddu-dev.westcentralus.cloudapp.azure.com
      service.beta.kubernetes.io/azure-dns-label-name: ""   # overridden by --set
      # Azure LB HTTP health probe on nodePort returns 404 → backends marked unhealthy → traffic dropped.
      # TCP probe just checks the port accepts connections — correct for a reverse proxy.
      service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "tcp"

  # TCP port mappings for non-HTTP services (ConfigMap created by tcp section below)
  extraArgs:
    tcp-services-configmap: "$(POD_NAMESPACE)/tcp-services"

  # Schedule on the orchestration worker pool
  nodeSelector:
    kubernetes.io/os: linux
    agentpool: workerpool

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Preserve client source IPs
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"

  # Admission webhook needs to be reachable — keep enabled
  admissionWebhooks:
    enabled: true

defaultBackend:
  enabled: true
  replicaCount: 1

# TCP services — port 8080 on the LoadBalancer proxied to Airflow webserver
tcp:
  8080: "airflow/airflow-api-server:8080"
