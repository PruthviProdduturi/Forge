<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Crosshair ring -->
  <circle cx="16" cy="16" r="11" stroke="white" stroke-width="2.2"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="2.4" fill="white"/>
  <!-- Top tick -->
  <line x1="16" y1="2.5" x2="16" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom tick -->
  <line x1="16" y1="25" x2="16" y2="29.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Left tick -->
  <line x1="2.5" y1="16" x2="7" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right tick -->
  <line x1="25" y1="16" x2="29.5" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
