<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#3b82f6"/>
  <!-- Crosshair ring -->
  <circle cx="16" cy="16" r="10" stroke="white" stroke-width="2"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="2.2" fill="white"/>
  <!-- Top tick -->
  <line x1="16" y1="3.5" x2="16" y2="7.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Bottom tick -->
  <line x1="16" y1="24.5" x2="16" y2="28.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left tick -->
  <line x1="3.5" y1="16" x2="7.5" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right tick -->
  <line x1="24.5" y1="16" x2="28.5" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
